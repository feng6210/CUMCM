interface:
  display_name: "数学建模：总控调度"
  short_description: "默认走精简闭环；仅在高风险、正式提交或审计场景升级检查。"
  brand_color: "#2563EB"
  default_prompt: "请使用 $math-modeling-orchestrator 推进数学建模任务。默认采用 standard 精简执行：先读题和附件，锁定会改变模型结构的关键语义；选择一个可解释、可验证的主模型并直接求解；按声明强度做必要验证；最后只生成用户真正需要的代码、图表、论文或结论。不要为了流程本身强制生成 QUESTION_DECOMPOSITION、PROBLEM_SEMANTICS、RUN_MANIFEST、BENCHMARK_CHALLENGE、RESULTS_TO_CLAIMS、NARRATIVE_MAP、FIGURE_PLAN 等中间工件，除非它们会被后续步骤实际消费、需要团队交接，或用户明确要求审计/复现。不要固定 A/B/C 三路线，不要默认等待用户批准主路线；只有高风险题意歧义、明显不同的高成本路线、重大外部资源调用或用户明确要求先审批时再停下来确认。基线、外部 benchmark、多 seed、敏感性分析、独立审查按问题性质和声明强度启用，不做形式化堆叠。live_contest 仅在确实涉及赛事期间的 AI/联网/外部资料使用时启用 COMPETITION_POLICY。普通完整论文走 formal_delivery：完整正文、真实结果、图表、引用、XeLaTeX 编译与视觉检查；只有用户明确要求 provenance-bound competition-ready 审计时才进入 strict_submission_audit，并执行 references/full_submission_contract.md 与 final_delivery_check.py --competition-ready。图表按读者任务决定，不设固定数量；示意图优先清晰可编辑，结果图必须绑定真实数据。任何失败、未验证结果或能力缺口都要如实披露，但不要把工程审计日志塞进竞赛正文。"
policy:
  allow_implicit_invocation: true
