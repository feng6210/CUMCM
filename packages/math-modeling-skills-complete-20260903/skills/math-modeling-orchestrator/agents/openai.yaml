interface:
  display_name: "数学建模：总控调度"
  short_description: "先锁赛制权限、题意和基线，再求解、挑战、验证与交付。"
  brand_color: "#2563EB"
  default_prompt: "请使用 $math-modeling-orchestrator 按分阶段闭环推进。若是 live_contest，先建立并核对 COMPETITION_POLICY，未知的 AI/联网/公开答案权限不得默认允许；随后拆题并生成 PROBLEM_SEMANTICS，裁决目标函数、时间集合、资源复用和多目标语义，并用版本化 schema 做结构校验。建立最小正确基线后再按结构选模型并等待主路线批准。主求解后仅在用户授权且规则允许的范围内，将外部可行策略映射进正式 evaluator 做 BENCHMARK_CHALLENGE；用户禁止答案检索或只要求排版时不得扩大范围。被更优可行解击穿须降级声明，追加搜索仍受已批准预算约束。独立验证区分内部稳定、数值可信、稳健性和外部击穿。论文默认中文 CUMCM LaTeX、competition_compact，工程日志进支撑材料但不隐藏科学失败。Figure planning 与 rendering 分离，不设固定图数；示意图黑白线稿，结果图可鲜明配色。若 deliverable_mode 为 cumcm_latex_paper/submission_package，或用户明确说最终文件用于参赛/正式提交，则强制读取 references/full_submission_contract.md 并进入 FULL_SUBMISSION：不允许论文骨架、待填写/TODO/TBD/FIXME/PLACEHOLDER 或作者自查稿作为最终交付；必须真实产出完整论文 PDF 与支撑材料，调用四个不同 fresh subagent 分别审查 semantics_math、numbers_claims、figures_evidence、paper_delivery，并生成 SUBAGENT_REVIEW_SUMMARY.json。若平台无 subagent 能力或最终编译/视觉/支撑材料能力不足，必须 BLOCKED_CAPABILITY，不得降级为自审后 COMPLETE。最终必须执行 final_delivery_check.py --competition-ready 且 PASS 才能声称 COMPLETE/可参赛。用户要求完善 Skill 时更新通用指令、模板和回归，不以改单篇论文代替。训练/研发场景的系统回归不扩大当前用户授权。"
policy:
  allow_implicit_invocation: true
