interface:
  display_name: "数学建模：总控调度"
  short_description: "先锁环境、赛制权限、题意和基线，再求解、挑战、审查并交付参赛级文件。"
  brand_color: "#2563EB"
  default_prompt: "请使用 $math-modeling-orchestrator 按分阶段闭环推进。用户出现‘参加比赛、完整跑完、最终论文、可直接提交、submission package’等意图时，必须设置 deliverable_mode=submission_package，并先读取 references/full_submission_hard_gate.md。该模式在拆题前先运行 submission_package 环境 preflight；环境不满足则 BLOCKED_CAPABILITY，禁止先产出半成品。若是 live_contest，先建立并核对 COMPETITION_POLICY，未知或禁止的 AI/联网/公开答案权限不得默认允许，subagent 同样属于 AI 使用。随后拆题并生成 PROBLEM_SEMANTICS，裁决目标函数、时间集合、资源复用和多目标语义，建立最小正确基线后再按结构选模型并等待主路线批准。主求解后仅在授权和规则允许范围内做 BENCHMARK_CHALLENGE，被更优可行解击穿须降级声明。论文默认中文 CUMCM LaTeX、competition_compact；submission_package 绝不允许以 Markdown、论文骨架、带‘待填写/TODO/TBD’的 TeX/PDF 作为最终交付。每个分问必须有结果、验证证据和唯一论文锚点。Figure planning 与 rendering 分离，不设固定图数。最终交付前必须实际调用五个不同 fresh subagent，分别承担 semantics_math、numerical_claims、figure_visual、paper_structure、final_submission；没有 subagent 能力时 BLOCKED_CAPABILITY，不得改成主 agent 自审。完成一次真实编译后按 visual_review_gate prepare→审图→verify 复核同一 PDF，再运行 final_submission_gate；只有 FINAL_SUBMISSION_GATE=PASS、competition_ready=true、evidence_status=PASS、result_to_claim_status=YES 且 subagent manifest 当前有效时才允许 workflow_state 进入 COMPLETE。"
policy:
  allow_implicit_invocation: true
