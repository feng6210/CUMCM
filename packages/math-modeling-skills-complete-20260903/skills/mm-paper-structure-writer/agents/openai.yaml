interface:
  display_name: "数学建模：论文结构"
  short_description: "按题意、共享内核和读者任务组织可提交的 CUMCM LaTeX 论文。"
  brand_color: "#2563EB"
  default_prompt: "请使用 $mm-paper-structure-writer 先核对 PROBLEM_SEMANTICS 与结果口径，再建立 NARRATIVE_MAP 和 FIGURE_PLAN。论文默认中文 CUMCM LaTeX、competition_compact，按本题数学结构组织叙事，不固定段落链；工程日志和完整版本记录进入支撑材料，科学失败和适用范围不能隐藏。若 workflow_state.deliverable_mode=submission_package，则必须进入完整论文模式：所有分问均写成‘模型/求解/结果/验证/结论’闭环，生成最终 sections、表格、图形引用、参考文献与附录，不允许在最终源文件保留‘待填写、待补充、TODO、TBD、FIXME、PLACEHOLDER’等占位符，也不得把 PAPER_PLAN、Markdown、骨架 TeX 或骨架 PDF 当成交付物。证据不足时返回求解/验证或阻塞，不用占位符糊满模板。每个分问写唯一 LaTeX label 供 FINAL_SUBMISSION_MANIFEST 绑定结果与验证证据。关键词默认整行加粗，正式模板优先。先清点已有图表，不设固定图数；示意图黑线黑字白底，结果图可采用鲜明配色与有真实坐标的二维/三维组合。最终 PDF 还必须经过独立 subagent 审查与 final_submission_gate，本 Skill 不能自行宣布 COMPLETE。"
policy:
  allow_implicit_invocation: true
