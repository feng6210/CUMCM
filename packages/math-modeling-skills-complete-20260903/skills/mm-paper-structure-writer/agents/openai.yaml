interface:
  display_name: "数学建模：论文结构"
  short_description: "按题意、共享内核和读者任务组织紧凑的 CUMCM LaTeX 论文。"
  brand_color: "#2563EB"
  default_prompt: "请使用 $mm-paper-structure-writer 先核对 PROBLEM_SEMANTICS 与结果口径，再建立 NARRATIVE_MAP 和 FIGURE_PLAN。论文默认 competition_compact：突出题目→数学结构/机制→模型增量→求解→关键结果→必要验证；hash、gate 名、旧版本 FAIL 谱系、全部种子、微小数值差和后端 audit 默认移入附录/支撑材料。Figure planning 在写作前完成，不设每问固定图数；复杂几何/机理优先二维解释图，算法流程图只在算法本身成为理解障碍时使用。"
policy:
  allow_implicit_invocation: true
