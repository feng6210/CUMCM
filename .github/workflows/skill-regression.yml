name: skill-regression

on:
  pull_request:
    paths:
      - "packages/math-modeling-skills-complete-20260903/skills/**"
      - "tests/test_skill_workflow_regressions.py"
      - ".github/workflows/skill-regression.yml"
  push:
    branches: [main]
    paths:
      - "packages/math-modeling-skills-complete-20260903/skills/**"
      - "tests/test_skill_workflow_regressions.py"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Compile modified Python workflow scripts
        run: |
          python -m py_compile packages/math-modeling-skills-complete-20260903/skills/math-modeling-orchestrator/scripts/workflow_state.py
          python -m py_compile packages/math-modeling-skills-complete-20260903/skills/mm-visualization-delivery/scripts/validate_figure_intent.py
      - name: Run regression tests
        run: python -m unittest tests/test_skill_workflow_regressions.py -v
